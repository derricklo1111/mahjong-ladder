<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="麻將天梯" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>麻將天梯 Rank S1</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --card-bg-2: #22262f;
      --accent: #e50914;
      --text-main: #f0f2f5;
      --text-sub: #7a8290;
      --win-color: #ff4d4f;   /* 紅色代表贏錢 */
      --lose-color: #52c41a;  /* 綠色代表輸錢 */
      --warn: #faad14;
      --gold: #fadb14;
      --silver: #d9d9d9;
      --bronze: #d48806;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container { width: 100%; max-width: 480px; }

    header { text-align: center; margin: 20px 0 20px; }
    header h1 { margin: 0; font-size: 26px; letter-spacing: 1.5px; font-weight: 800; }
    header p { margin-top: 6px; font-size: 13px; color: var(--text-sub); }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tabs {
      flex: 1;
      display: flex;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text-sub);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 0;
      border-radius: 7px;
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--card-bg-2); color: var(--text-main); }
    .refresh {
      border: 0;
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 10px;
      width: 44px;
      font-size: 18px;
      cursor: pointer;
    }
    .refresh.spinning span { display: inline-block; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-box {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-size: 15px;
    }
    .notice {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin: -6px 0 12px;
    }
    .notice.warn { color: var(--warn); }

    .list { display: flex; flex-direction: column; gap: 12px; }

    .player-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .left-section { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .rank-tag {
      font-size: 18px;
      font-weight: 800;
      width: 30px;
      flex-shrink: 0;
      text-align: center;
      color: var(--text-sub);
    }
    .rank-1 { color: var(--gold); }
    .rank-2 { color: var(--silver); }
    .rank-3 { color: var(--bronze); }

    .info-block { min-width: 0; }
    .info-block .name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .info-block .meta { font-size: 12px; color: var(--text-sub); margin-top: 3px; }

    .trend { display: flex; gap: 3px; margin-top: 6px; }
    .trend i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-sub); }
    .trend i.w { background: var(--win-color); }
    .trend i.l { background: var(--lose-color); }

    .score-block { text-align: right; flex-shrink: 0; }
    .amount {
      font-size: 19px;
      font-weight: 800;
      font-family: "SF Pro Rounded", ui-monospace, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .amount.win { color: var(--win-color); }
    .amount.lose { color: var(--lose-color); }
    .amount.even { color: var(--text-sub); }
    .score-block .avg { font-size: 11px; color: var(--text-sub); margin-top: 3px; }

    /* 對局紀錄 */
    .day-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin: 8px 4px -4px;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .game-card.invalid { outline: 1px solid var(--warn); }
    .game-card .seat { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .game-card .seat .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .game-card .seat .amount { font-size: 14px; }
    .game-card .flag {
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--warn);
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      margin: 24px 0 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🀄 麻將天梯 S1</h1>
      <p>大家都說自己輸，到底誰贏？</p>
    </header>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="ladder" aria-selected="true">排行榜</button>
        <button class="tab" role="tab" data-view="history" aria-selected="false">對局紀錄</button>
      </div>
      <button id="refresh" class="refresh" title="重新整理" aria-label="重新整理"><span>↻</span></button>
    </div>

    <div id="notice" class="notice" hidden></div>
    <div id="status" class="status-box">🀄 洗牌中，拉取最新戰績…</div>
    <div id="list" class="list"></div>

    <footer id="footer"></footer>
  </div>

  <script>
    // ⚠️ 替換為你的 Google Apps Script Web App URL（保留預設值會進入示範模式）
    const API_URL = "https://script.google.com/macros/s/AKfycbz43FyxgqeSjdQK09IQ0z4RBW1c8wTwMdInA1ZG5BsDpIKYs9mYQDuAscEiGxrfEX3m/exec";

    const DEMO_MODE = !/^https:\/\//.test(API_URL);
    const CACHE_KEY = "mahjong-ladder:data";
    const TREND_LENGTH = 5;

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const noticeEl = document.getElementById("notice");
    const footerEl = document.getElementById("footer");
    const refreshBtn = document.getElementById("refresh");

    let records = [];
    let currentView = "ladder";

    // ---------- 工具 ----------

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function formatScore(n) {
      const cls = n > 0 ? "win" : n < 0 ? "lose" : "even";
      const sign = n > 0 ? "+" : "";
      return `<span class="amount ${cls}">${sign}${n.toLocaleString()}</span>`;
    }

    function readCache() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; }
    }
    function writeCache(payload) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); } catch {}
    }

    // 相容舊版 API（直接回傳陣列）與新版（{ updatedAt, records }）
    function normalize(payload) {
      if (Array.isArray(payload)) return { updatedAt: null, records: payload };
      if (payload && payload.error) throw new Error(payload.error);
      return { updatedAt: payload.updatedAt || null, records: payload.records || [] };
    }

    // ---------- 計算 ----------

    function buildLeaderboard(data) {
      const players = {};

      // 依日期排序後累計，確保近況趨勢是時間順序
      const sorted = [...data].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.row || 0) - (b.row || 0)));

      sorted.forEach(round => {
        round.matches.forEach(item => {
          if (!item.name) return;
          const p = players[item.name] ||= { total: 0, matches: 0, wins: 0, best: -Infinity, history: [] };
          p.total += item.score;
          p.matches += 1;
          if (item.score > 0) p.wins += 1;
          p.best = Math.max(p.best, item.score);
          p.history.push(item.score);
        });
      });

      const list = Object.entries(players)
        .map(([name, s]) => ({
          name,
          total: s.total,
          matches: s.matches,
          winRate: Math.round((s.wins / s.matches) * 100),
          avg: Math.round(s.total / s.matches),
          best: s.best,
          trend: s.history.slice(-TREND_LENGTH)
        }))
        .sort((a, b) => b.total - a.total || b.winRate - a.winRate || a.name.localeCompare(b.name, "zh-Hant"));

      // 同分同名次（1, 2, 2, 4）
      list.forEach((p, i) => {
        p.rank = i > 0 && p.total === list[i - 1].total ? list[i - 1].rank : i + 1;
      });

      return list;
    }

    // ---------- 渲染 ----------

    function renderLadder() {
      const board = buildLeaderboard(records);
      if (!board.length) return showStatus("目前還沒有任何對局紀錄。");

      listEl.innerHTML = board.map(p => {
        const rankClass = p.rank <= 3 ? `rank-${p.rank}` : "";
        const trend = p.trend.map(s => `<i class="${s > 0 ? "w" : s < 0 ? "l" : ""}"></i>`).join("");
        return `
          <div class="player-card">
            <div class="left-section">
              <div class="rank-tag ${rankClass}">#${p.rank}</div>
              <div class="info-block">
                <div class="name">${escapeHtml(p.name)}</div>
                <div class="meta">${p.matches} 場 · 勝率 ${p.winRate}% · 單場最佳 ${p.best > 0 ? "+" : ""}${p.best}</div>
                <div class="trend" title="最近 ${TREND_LENGTH} 場">${trend}</div>
              </div>
            </div>
            <div class="score-block">
              ${formatScore(p.total)}
              <div class="avg">場均 ${p.avg > 0 ? "+" : ""}${p.avg}</div>
            </div>
          </div>`;
      }).join("");
    }

    function renderHistory() {
      if (!records.length) return showStatus("目前還沒有任何對局紀錄。");

      // 新到舊，依日期分組
      const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.row || 0) - (a.row || 0)));
      let html = "";
      let lastDate = null;

      sorted.forEach(r => {
        if (r.date !== lastDate) {
          html += `<div class="day-title">${escapeHtml(r.date)}</div>`;
          lastDate = r.date;
        }
        const sum = r.sum ?? r.matches.reduce((acc, m) => acc + m.score, 0);
        const invalid = r.valid === false || sum !== 0;
        const seats = [...r.matches]
          .sort((a, b) => b.score - a.score)
          .map(m => `<div class="seat"><span class="n">${escapeHtml(m.name)}</span>${formatScore(m.score)}</div>`)
          .join("");
        const flag = invalid
          ? `<div class="flag">⚠️ 輸贏加總 ${sum > 0 ? "+" : ""}${sum}，不為零${r.row ? `（試算表第 ${r.row} 列）` : ""}</div>`
          : "";
        html += `<div class="game-card${invalid ? " invalid" : ""}">${seats}${flag}</div>`;
      });

      listEl.innerHTML = html;
    }

    function render() {
      statusEl.hidden = true;
      if (currentView === "ladder") renderLadder();
      else renderHistory();

      const bad = records.filter(r => r.valid === false || (r.sum ?? 0) !== 0).length;
      if (bad && currentView === "ladder") {
        noticeEl.textContent = `⚠️ 有 ${bad} 筆對局輸贏加總不為零，請到「對局紀錄」檢查`;
        noticeEl.className = "notice warn";
        noticeEl.hidden = false;
      } else if (DEMO_MODE) {
        noticeEl.textContent = "示範模式：尚未設定 API_URL，以下為假資料";
        noticeEl.className = "notice";
        noticeEl.hidden = false;
      } else {
        noticeEl.hidden = true;
      }
    }

    function showStatus(msg) {
      listEl.innerHTML = "";
      statusEl.textContent = msg;
      statusEl.hidden = false;
    }

    function setFooter(updatedAt, fromCache) {
      const t = updatedAt ? new Date(updatedAt).toLocaleString("zh-TW", { hour12: false }) : "—";
      footerEl.textContent = `共 ${records.length} 場 · 資料時間 ${t}${fromCache ? "（快取）" : ""}`;
    }

    // ---------- 資料載入 ----------

    async function fetchData(force = false) {
      if (DEMO_MODE) return { updatedAt: new Date().toISOString(), records: demoRecords() };
      const url = force ? `${API_URL}${API_URL.includes("?") ? "&" : "?"}nocache=1` : API_URL;
      const res = await fetch(url, { redirect: "follow" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return normalize(await res.json());
    }

    async function load(force = false) {
      refreshBtn.classList.add("spinning");
      try {
        const payload = await fetchData(force);
        records = payload.records;
        if (!DEMO_MODE) writeCache(payload);
        render();
        setFooter(payload.updatedAt, false);
      } catch (err) {
        console.error(err);
        if (!records.length) {
          showStatus("❌ 載入失敗，請確認 API URL 是否正確與權限開放設定（誰可以存取：任何人）。");
        } else {
          noticeEl.textContent = "⚠️ 無法更新，目前顯示的是上次的資料";
          noticeEl.className = "notice warn";
          noticeEl.hidden = false;
        }
      } finally {
        refreshBtn.classList.remove("spinning");
      }
    }

    // ---------- 示範資料 ----------

    function demoRecords() {
      const names = ["阿明", "小美", "老王", "胖虎", "大雄"];
      const out = [];
      let seed = 7;
      const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      for (let i = 0; i < 14; i++) {
        const day = new Date(2026, 8, 1 + i * 3);
        const pool = [...names].sort(() => rand() - 0.5).slice(0, 4);
        const s = [0, 0, 0].map(() => Math.round((rand() * 1000 - 500) / 50) * 50);
        s.push(-s.reduce((a, b) => a + b, 0));
        out.push({
          row: i + 2,
          date: day.toISOString().slice(0, 10),
          sum: 0,
          valid: true,
          matches: pool.map((name, k) => ({ name, score: s[k] }))
        });
      }
      // 故意放一筆加總不為零，示範檢查功能
      out.push({
        row: 16, date: "2026-10-20", sum: 100, valid: false,
        matches: [{ name: "阿明", score: 400 }, { name: "小美", score: -100 }, { name: "老王", score: -100 }, { name: "胖虎", score: -100 }]
      });
      return out;
    }

    // ---------- 事件 ----------

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        currentView = tab.dataset.view;
        document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t === tab)));
        if (records.length) render();
      });
    });

    refreshBtn.addEventListener("click", () => load(true));

    // 先顯示上次快取（秒開），再背景更新
    const cached = !DEMO_MODE && readCache();
    if (cached && cached.records) {
      records = cached.records;
      render();
      setFooter(cached.updatedAt, true);
    }
    load();
  </script>
</body>
</html>
