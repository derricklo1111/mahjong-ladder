<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="雀市看盤" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" />
  <title>雀市看盤</title>
  <style>
    * { box-sizing: border-box; }
    [hidden]:not(.toast) { display: none !important; }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      padding-block: max(20px, env(safe-area-inset-top)) 24px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      -webkit-tap-highlight-color: transparent;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.5;
    }
    .container { width: 100%; max-width: 480px; }
    header { margin: 20px 0 28px; }
    header h1 { margin: 0; text-wrap: balance; }
    header p { margin: 0; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 18px; align-items: stretch; }
    .tabs { flex: 1; display: flex; gap: 4px; }
    .tab { flex: 1; }
    .tab, .refresh, .btn { cursor: pointer; font-family: inherit; }
    .refresh { width: 44px; }
    .refresh.spinning span { display: inline-block; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-box { text-align: center; padding: 36px 12px; }
    .notice { text-align: center; margin: -6px 0 14px; font-size: 13px; }
    .list { display: flex; flex-direction: column; gap: 14px; }
    .amount { font-variant-numeric: tabular-nums lining-nums; }
    .entry { display: flex; flex-direction: column; gap: 16px; padding: 20px 18px; }
    .edit-banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .entry .field, .entry label.field { display: flex; flex-direction: column; gap: 6px; }
    .entry input { width: 100%; min-width: 0; font-size: 16px; border-radius: 0; }
    #seats { display: flex; flex-direction: column; gap: 10px; }
    .seat-row { display: grid; grid-template-columns: 28px 1fr 40px 92px; gap: 8px; align-items: center; }
    .seat-row .p { text-align: center; }
    .seat-row .sign { height: 100%; min-height: 38px; cursor: pointer; font-family: inherit; }
    .seat-row input.score { text-align: right; }
    .sum-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 32px; }
    .dong-field { display: grid !important; grid-template-columns: 1fr 92px; align-items: center; }
    .room-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -10px 0 16px; }
    .house-toggle { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin: -8px 0 12px; cursor: pointer; user-select: none; }
    .house-toggle input { appearance: none; width: 15px; height: 15px; margin: 0; display: grid; place-items: center; cursor: pointer; }
    .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); white-space: nowrap; padding: 10px 18px; transition: opacity 0.2s; }
    .toast[hidden] { display: block; opacity: 0; pointer-events: none; }
    footer { text-align: center; margin: 32px 0 8px; font-size: 11px; }
    .login { margin-bottom: 18px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>

  <!-- 雀市看盤：深色看盤終端，紅漲綠跌（台股慣例，紅＝賺），數字一律等寬；金色只給指數與焦點 -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d11;
      --panel: #11151b;
      --panel-hi: #181c24;
      --line: #222833;
      --ink: #e7eaf0;
      --mute: #7d8697;
      --up: #ff4d57;
      --down: #1fc46b;
      --gold: #f2c14e;
      --accent: #f2c14e;
      --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body { font-size: 14px; }
    header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; margin: 12px 0 14px; }
    header h1 { font-weight: 900; font-size: 30px; letter-spacing: 0.04em; }
    header .sub { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: 0.06em; }
    header p { flex-basis: 100%; font-size: 13px; color: var(--mute); }
    #hero { margin-bottom: 18px; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .index-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .ix-label { font-size: 12px; color: var(--mute); }
    .ix-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
    .ix-val { font-family: var(--mono); font-weight: 700; font-size: 32px; color: var(--up); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .ix-chg { font-family: var(--mono); font-size: 14px; }
    .ix-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 12px; color: var(--mute); }
    .ix-meta b { font-family: var(--mono); }
    .tape { overflow: hidden; white-space: nowrap; border-block: 1px solid var(--line); margin-top: 12px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
    .tape-track { display: inline-flex; padding: 7px 0; animation: tape 30s linear infinite; font-size: 12px; color: var(--mute); }
    .tape-track span { padding-right: 26px; }
    .tape-track b { font-family: var(--mono); font-weight: 600; margin-left: 6px; }
    @keyframes tape { to { transform: translateX(-50%); } }
    .room-bar { font-size: 12px; color: var(--mute); }
    .room-bar b { color: var(--ink); font-size: 14px; margin-left: 6px; }
    .room-bar small { color: var(--gold); margin-left: 4px; }
    .btn { background: var(--panel-hi); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; }
    .btn.small { font-size: 12px; padding: 5px 12px; }
    .btn.primary { background: var(--up); border-color: var(--up); color: #fff; font-size: 16px; font-weight: 700; padding: 12px; letter-spacing: 0.2em; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .toolbar { margin-bottom: 10px; }
    .tabs { gap: 0; border-bottom: 1px solid var(--line); }
    .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--mute); padding: 10px 0; font-size: 14px; font-weight: 500; }
    .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
    .refresh { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--mute); }
    .status-box { color: var(--mute); font-family: var(--mono); }
    .notice { color: var(--mute); }
    .notice.warn { color: var(--gold); }
    .list { gap: 0; }
    .q-head, .player-card.quote { display: grid; grid-template-columns: minmax(0, 1fr) 96px 104px; gap: 4px 12px; }
    .q-head { padding: 0 2px 6px; font-size: 11px; color: var(--mute); border-bottom: 1px solid var(--line); }
    .q-head span:last-child { text-align: right; }
    .player-card.quote { align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .q-id { min-width: 0; }
    .q-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-code { font-family: var(--mono); font-size: 11px; color: var(--mute); margin-top: 1px; }
    .q-code span { margin: 0 5px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; line-height: 1.5; padding: 0 5px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
    .badge.limit-up { background: var(--up); color: #fff; }
    .badge.limit-down { background: var(--down); color: #03140a; }
    .badge.hold { background: var(--gold); color: #261b02; }
    .spark { width: 96px; height: 30px; display: block; overflow: visible; }
    .spark .base { stroke: #3a414e; stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
    .spark .ln { fill: none; stroke-width: 1.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .spark.up .ln { stroke: var(--up); }
    .spark.down .ln { stroke: var(--down); }
    .spark .area { opacity: 0.14; }
    .spark.up .area { fill: var(--up); }
    .spark.down .area { fill: var(--down); }
    .q-px { text-align: right; }
    .q-px .amount { font-family: var(--mono); font-weight: 700; font-size: 17px; }
    .amount.win { color: var(--up); }
    .amount.lose { color: var(--down); }
    .amount.even { color: var(--mute); }
    .q-chg { font-family: var(--mono); font-size: 12px; margin-top: 1px; }
    .q-chg.flat { color: var(--mute); }
    .q-stats { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11px; color: var(--mute); }
    .q-stats b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
    .player-card.house .q-name { color: var(--gold); }
    .boss-warning { grid-column: 1 / -1; font-size: 12px; line-height: 1.7; color: var(--mute); border: 1px dashed #4d421e; background: rgba(242, 193, 78, 0.05); border-radius: 6px; padding: 8px 10px; margin-top: 4px; }
    .boss-warning b { color: var(--gold); }
    .day-title { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--mute); margin: 16px 2px 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
    .list > .day-title:first-child { margin-top: 0; }
    .game-card.tx { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .game-card.tx.invalid { border-color: var(--gold); }
    .tx-head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--mute); margin-bottom: 4px; }
    .tx-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 28px 84px; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .tx-code { font-family: var(--mono); font-size: 11px; color: var(--mute); }
    .tx-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-side { font-size: 11px; line-height: 1.6; text-align: center; border-radius: 3px; color: var(--mute); border: 1px solid var(--line); }
    .tx-side.up { color: var(--up); border-color: rgba(255, 77, 87, 0.6); }
    .tx-side.down { color: var(--down); border-color: rgba(31, 196, 107, 0.6); }
    .tx-row .amount { font-family: var(--mono); font-weight: 600; text-align: right; }
    .tx-row.tax .n { color: var(--gold); }
    .game-card .flag { font-size: 12px; color: var(--gold); margin-top: 6px; }
    .game-card .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
    .game-card .del, .game-card .edit { background: transparent; border: 1px solid var(--line); color: var(--mute); border-radius: 5px; font: inherit; font-size: 12px; padding: 3px 12px; cursor: pointer; }
    .game-card .edit:hover { color: var(--ink); border-color: var(--mute); }
    .game-card .del:hover { color: var(--up); border-color: var(--up); }
    .entry.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .entry-title { font-size: 16px; font-weight: 700; letter-spacing: 0.1em; }
    .edit-banner { font-size: 13px; color: var(--gold); background: rgba(242, 193, 78, 0.08); border-radius: 6px; padding: 8px 10px; }
    .entry .field, .entry label.field { font-size: 12px; color: var(--mute); }
    .entry input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font-family: var(--body); padding: 9px 10px; }
    .entry input:focus { outline: none; border-color: var(--gold); }
    .entry input::placeholder { color: #465062; }
    .seat-row .p { font-family: var(--mono); font-size: 11px; color: var(--mute); }
    .seat-row .sign { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 16px; font-weight: 700; }
    .seat-row .sign.pos { color: var(--up); border-color: rgba(255, 77, 87, 0.5); }
    .seat-row .sign.neg { color: var(--down); border-color: rgba(31, 196, 107, 0.5); }
    .seat-row input.score { font-family: var(--mono); font-weight: 700; font-size: 17px; }
    .sum-line { font-family: var(--mono); font-size: 13px; }
    .sum-line.ok { color: var(--ink); }
    .sum-line.bad { color: var(--gold); }
    .dong-field small { color: var(--mute); font-size: 11px; }
    .entry .error { color: var(--up); font-size: 13px; min-height: 1em; }
    .login-sub { font-size: 13px; color: var(--mute); text-align: center; margin: -6px 0 2px; }
    .house-toggle { font-size: 12px; color: var(--mute); }
    .house-toggle input { border: 1px solid var(--mute); border-radius: 3px; background: transparent; }
    .house-toggle input:checked { background: var(--gold); border-color: var(--gold); }
    .house-toggle input:checked::after { content: ""; width: 5px; height: 5px; background: var(--bg); }
    .toast { background: var(--panel-hi); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font-size: 13px; }
    footer { color: var(--mute); font-family: var(--mono); }
    @media (max-width: 380px) {
      .q-head, .player-card.quote { grid-template-columns: minmax(0, 1fr) 70px 96px; }
      .spark { width: 70px; }
    }
  </style>

</head>
<body>

  <div class="container">
    <header>
      <h1>雀市看盤</h1>
      <div class="sub">MJX · 麻雀交易所</div>
      <p>大家都說自己賠，到底誰賺？</p>
    </header>
    <div id="hero"></div>

    <div class="room-bar">
      <span><span>帳戶</span> <b id="room-name">測試房間</b> <small id="room-mode"></small></span>
      <button type="button" id="auth-btn" class="btn small">登入</button>
    </div>

    <form id="login" class="entry login panel" hidden>
      <div class="entry-title">帳戶登入</div>
      <p class="login-sub">輸入房主給你的帳號密碼，進入你們這桌的帳戶</p>
      <label class="field">帳號
        <input id="login-user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" />
      </label>
      <label class="field">密碼
        <input id="login-pass" name="password" type="password" autocomplete="current-password" />
      </label>
      <div id="login-error" class="error" role="alert"></div>
      <button type="submit" id="login-submit" class="btn primary">登入</button>
      <button type="button" id="login-cancel" class="btn small">先看看測試數據</button>
    </form>

    <div id="app">
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="ladder" aria-selected="true">看盤</button>
        <button class="tab" role="tab" data-view="history" aria-selected="false">成交明細</button>
        <button class="tab" role="tab" data-view="entry" aria-selected="false" id="entry-tab">下單</button>
      </div>
      <button id="refresh" class="refresh" title="重新整理" aria-label="重新整理"><span>↻</span></button>
    </div>

    <label id="house-toggle" class="house-toggle">
      <input type="checkbox" id="show-house" checked />
      <span>顯示「東・證交稅」</span>
    </label>
    <div id="notice" class="notice" hidden></div>
    <div id="status" class="status-box"></div>
    <div id="list" class="list"></div>

    <form id="entry" class="entry panel" hidden autocomplete="off">
      <div class="entry-title" id="entry-title">委託下單</div>
      <div id="edit-banner" class="edit-banner" hidden>
        <span id="edit-label"></span>
        <button type="button" id="edit-cancel" class="btn small">取消修改</button>
      </div>
      <label class="field">日期
        <input type="date" id="entry-date" required />
      </label>
      <div class="field">
        <span>四位投資人與損益</span>
        <div id="seats"></div>
      </div>
      <label class="field dong-field">
        <span>證交稅 <small>（這局被東抽走的錢，沒有就填 0）</small></span>
        <input id="entry-dong" class="score" inputmode="numeric" pattern="[0-9]*" placeholder="0" aria-label="東錢" />
      </label>
      <div id="sum-line" class="sum-line"></div>
      <div id="entry-error" class="error" role="alert"></div>
      <button type="submit" id="entry-submit" class="btn primary" disabled>送出委託</button>
    </form>
    <datalist id="player-names"></datalist>

    <footer id="footer"></footer>
    </div>
  </div>

  <div id="toast" class="toast panel" hidden role="status"></div>

  <script>
    // ⚠️ 替換為你的 Google Apps Script Web App URL（保留預設值會進入示範模式）
    const API_URL = "https://script.google.com/macros/s/AKfycbz43FyxgqeSjdQK09IQ0z4RBW1c8wTwMdInA1ZG5BsDpIKYs9mYQDuAscEiGxrfEX3m/exec";

    const DEMO_MODE = !/^https:\/\//.test(API_URL);
    const CACHE_KEY = "mahjong-ladder:data";
    const SESSION_KEY = "mahjong-ladder:session";
    const GUEST_ROOM = "測試房間";
    const CREATOR_CUT = 0.3; // 東錢分給創作者的比例（純屬玩笑）

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const noticeEl = document.getElementById("notice");
    const footerEl = document.getElementById("footer");
    const refreshBtn = document.getElementById("refresh");
    const entryForm = document.getElementById("entry");
    const entryDate = document.getElementById("entry-date");
    const seatsEl = document.getElementById("seats");
    const sumLineEl = document.getElementById("sum-line");
    const entryErrorEl = document.getElementById("entry-error");
    const entrySubmit = document.getElementById("entry-submit");
    const playerNamesEl = document.getElementById("player-names");
    const toastEl = document.getElementById("toast");
    const entryDong = document.getElementById("entry-dong");
    const appEl = document.getElementById("app");
    const loginForm = document.getElementById("login");
    const loginUser = document.getElementById("login-user");
    const loginPass = document.getElementById("login-pass");
    const loginErrorEl = document.getElementById("login-error");
    const loginSubmit = document.getElementById("login-submit");
    const roomNameEl = document.getElementById("room-name");
    const roomModeEl = document.getElementById("room-mode");
    const authBtn = document.getElementById("auth-btn");
    const entryTab = document.getElementById("entry-tab");
    const houseToggleEl = document.getElementById("house-toggle");
    const showHouseEl = document.getElementById("show-house");
    const SHOW_HOUSE_KEY = "mahjong-ladder:showHouse";
    const heroEl = document.getElementById("hero");
    const entryTitleEl = document.getElementById("entry-title");
    const editBannerEl = document.getElementById("edit-banner");
    const editLabelEl = document.getElementById("edit-label");
    const SEAT_COUNT = 4;
    const HOUSE_NAME = "東";

    // ---------- 看盤 ----------
    // 每個牌友是一檔股票：代號由名字算出，總輸贏就是股價
    const signed = n => `${n > 0 ? "+" : ""}${n.toLocaleString()}`;
    const nameHash = name => { let h = 7; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; };
    const tickerCode = name => String(1101 + (nameHash(name) % 8800));
    const volumeOf = recs => recs.reduce((a, r) => a + r.matches.reduce((b, m) => b + Math.max(0, m.score), 0), 0);

    // 累積損益走勢圖：從 0 開始，每局加上當局輸贏
    function sparkline(hist, w = 96, h = 30) {
      const pts = [0];
      hist.forEach(v => pts.push(pts[pts.length - 1] + v));
      const mx = Math.max(...pts, 0), mn = Math.min(...pts, 0), span = mx - mn || 1;
      const x = i => ((i / (pts.length - 1 || 1)) * w).toFixed(1);
      const y = v => (h - 3 - ((v - mn) / span) * (h - 6)).toFixed(1);
      const line = pts.map((v, i) => `${x(i)},${y(v)}`).join(" ");
      const end = pts[pts.length - 1];
      return `<svg class="spark ${end >= 0 ? "up" : "down"}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
        <line class="base" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/>
        <polygon class="area" points="0,${y(0)} ${line} ${x(pts.length - 1)},${y(0)}"/>
        <polyline class="ln" points="${line}"/>
      </svg>`;
    }

    // 雀市看盤的用詞與版面：排行（看盤）、每局（成交明細）、日期標題與上方大盤
    const T = {
      loading: "連線報價中⋯",
      entry: "委託下單", edit: "改單", submit: "送出委託", update: "確認改單",
      start: "登入", editBtn: "改單", delBtn: "刪單",

      hero(recs) {
        const vol = volumeOf(recs);
        const dates = [...new Set(recs.map(r => r.date))].sort();
        const last = dates[dates.length - 1];
        const todayVol = volumeOf(recs.filter(r => r.date === last));
        const prev = vol - todayVol;
        const pct = prev ? ((todayVol / prev) * 100).toFixed(2) : "—";
        const board = buildLeaderboard(recs, false);
        const ups = board.filter(p => p.total > 0).length;
        const downs = board.filter(p => p.total < 0).length;
        const tape = board.map(p => {
          const lastScore = p.history[p.history.length - 1] || 0;
          const cls = lastScore > 0 ? "up" : lastScore < 0 ? "down" : "";
          return `<span>${escapeHtml(p.name)} ${tickerCode(p.name)}<b class="${cls}">${lastScore > 0 ? "▲" : lastScore < 0 ? "▼" : "－"}${Math.abs(lastScore).toLocaleString()}</b></span>`;
        }).join("");
        return `
          <div class="index-card">
            <div class="ix-label">雀市累計成交指數</div>
            <div class="ix-row">
              <span class="ix-val">${vol.toLocaleString()}</span>
              <span class="ix-chg up">▲ ${todayVol.toLocaleString()}（+${pct}%）</span>
            </div>
            <div class="ix-meta"><span>最新交易日 ${escapeHtml(last)}</span><span>上漲 <b class="up">${ups}</b> 家</span><span>下跌 <b class="down">${downs}</b> 家</span></div>
          </div>
          <div class="tape" aria-hidden="true"><div class="tape-track">${tape}${tape}</div></div>`;
      },

      ladderHead: () => `<div class="q-head"><span>名稱・代號</span><span>累積走勢</span><span>損益・上局</span></div>`,

      card(p, ctx) {
        const code = p.isHouse ? "TAX" : tickerCode(p.name);
        const last = p.history[p.history.length - 1] || 0;
        const dir = last > 0 ? "up" : last < 0 ? "down" : "flat";
        let badge = "";
        if (p.isHouse) badge = `<span class="badge hold">穩賺</span>`;
        else if (p.rank === 1 && p.total > 0) badge = `<span class="badge limit-up">漲停</span>`;
        else if (p.rank === ctx.lastRank && p.total < 0) badge = `<span class="badge limit-down">跌停</span>`;
        return `
          <div class="player-card quote${p.isHouse ? " house" : ""}">
            <div class="q-id">
              <div class="q-name">${escapeHtml(p.isHouse ? "東・證交稅" : p.name)}${badge}</div>
              <div class="q-code">${code}<span>·</span>成交 ${p.matches} 筆</div>
            </div>
            ${sparkline(p.history)}
            <div class="q-px">${formatScore(p.total)}<div class="q-chg ${dir}">${last > 0 ? "▲" : last < 0 ? "▼" : "－"} ${Math.abs(last).toLocaleString()}</div></div>
            <div class="q-stats">
              <span>排名 <b>${p.rank}</b></span>
              <span>${p.isHouse ? "抽成率" : "勝率"} <b>${p.winRate}%</b></span>
              <span>均 <b>${signed(p.avg)}</b></span>
              <span>單局最高 <b>${signed(p.best)}</b></span>
            </div>
            ${p.isHouse ? bossWarning(p.total) : ""}
          </div>`;
      },

      day: d => `<div class="day-title"><span>${escapeHtml(d)}</span><span>收盤</span></div>`,

      round(r, g) {
        const row = (code, name, side, cls, score, extra = "") =>
          `<div class="tx-row${extra}"><span class="tx-code">${code}</span><span class="n">${name}</span><span class="tx-side ${cls}">${side}</span>${formatScore(score)}</div>`;
        const rows = g.ranked.map(m => row(tickerCode(m.name), escapeHtml(m.name),
          m.score > 0 ? "賺" : m.score < 0 ? "賠" : "平", m.score > 0 ? "up" : m.score < 0 ? "down" : "", m.score)).join("");
        const tax = g.dong ? row("TAX", "東・證交稅", "扣", "", g.dong, " tax") : "";
        return `
          <div class="game-card tx${g.invalid ? " invalid" : ""}">
            <div class="tx-head"><span>委託序號 ${String(r.row || 0).padStart(5, "0")}</span><span>${g.invalid ? "帳務異常" : "已成交"}</span></div>
            ${rows}${tax}${g.flag}${g.actions}
          </div>`;
      }
    };

    let records = [];
    let editing = null; // 修改中的那局：{ row, original: { date, dong, matches } }；null = 新增模式
    let session = null; // 登入後為 { token, room }；null = 訪客（只能看測試房間）
    let loadSeq = 0;    // 切換房間時丟掉還在路上的舊回應
    let currentView = "ladder";

    // ---------- 工具 ----------

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function formatScore(n) {
      const cls = n > 0 ? "win" : n < 0 ? "lose" : "even";
      const sign = n > 0 ? "+" : "";
      return `<span class="amount ${cls}">${sign}${n.toLocaleString()}</span>`;
    }

    // 每個房間各自快取，換房間不會看到別人的資料
    function cacheKey() { return `${CACHE_KEY}:${session ? session.room : GUEST_ROOM}`; }
    function readCache() {
      try { return JSON.parse(localStorage.getItem(cacheKey())); } catch { return null; }
    }
    function writeCache(payload) {
      try { localStorage.setItem(cacheKey(), JSON.stringify(payload)); } catch {}
    }
    function readSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; }
    }
    function writeSession(value) {
      try {
        if (value) localStorage.setItem(SESSION_KEY, JSON.stringify(value));
        else localStorage.removeItem(SESSION_KEY);
      } catch {}
    }

    // 相容舊版 API（直接回傳陣列）與新版（{ updatedAt, records }）
    function normalize(payload) {
      if (Array.isArray(payload)) return { updatedAt: null, records: payload };
      if (payload && payload.error) throw new Error(payload.error);
      return { updatedAt: payload.updatedAt || null, records: payload.records || [] };
    }

    // ---------- 計算 ----------

    function buildLeaderboard(data, includeHouse = true) {
      const players = {};

      // 依日期排序後累計，確保近況趨勢是時間順序
      const sorted = [...data].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.row || 0) - (b.row || 0)));

      sorted.forEach(round => {
        round.matches.forEach(item => {
          if (!item.name) return;
          const p = players[item.name] ||= { total: 0, matches: 0, wins: 0, best: -Infinity, history: [] };
          p.total += item.score;
          p.matches += 1;
          if (item.score > 0) p.wins += 1;
          p.best = Math.max(p.best, item.score);
          p.history.push(item.score);
        });
      });

      // 「東」也是一位選手：每局抽走的東錢就是它的戰績，看看是不是東賺最多
      const house = { total: 0, matches: 0, wins: 0, best: -Infinity, history: [] };
      sorted.forEach(round => {
        const dong = round.dong || 0;
        house.total += dong;
        house.matches += 1;
        if (dong > 0) house.wins += 1;
        house.best = Math.max(house.best, dong);
        house.history.push(dong);
      });

      const entries = Object.entries(players).map(([name, s]) => ({ name, s, isHouse: false }));
      if (includeHouse && house.total > 0) entries.push({ name: HOUSE_NAME, s: house, isHouse: true });

      const list = entries
        .map(({ name, s, isHouse }) => ({
          name,
          isHouse,
          total: s.total,
          matches: s.matches,
          winRate: Math.round((s.wins / s.matches) * 100),
          avg: Math.round(s.total / s.matches),
          best: s.best,
          history: s.history
        }))
        .sort((a, b) => b.total - a.total || b.winRate - a.winRate || a.name.localeCompare(b.name, "zh-Hant"));

      // 同分同名次（1, 2, 2, 4）
      list.forEach((p, i) => {
        p.rank = i > 0 && p.total === list[i - 1].total ? list[i - 1].rank : i + 1;
      });

      return list;
    }

    // ---------- 渲染 ----------

    function bossWarning(total) {
      const cut = Math.round(total * CREATOR_CUT);
      return `<div class="boss-warning">
        <span class="siren">⚠️</span> 東家溫馨提醒：本站創作者熬夜寫程式，頭髮已陣亡一半。
        東錢請自動抽 <b>${Math.round(CREATOR_CUT * 100)}%</b> LINE Pay 孝敬創作者，
        本房目前應繳 <b>${cut.toLocaleString()}</b> 元。
        賴帳者下一把聽牌必被截胡，自摸永遠差一張。🀄
      </div>`;
    }

    function renderLadder() {
      const board = buildLeaderboard(records, showHouseEl.checked);
      if (!board.length) return showStatus("目前還沒有任何對局紀錄。");

      // 墊底的人掛「跌停」（不算東）
      const ctx = { board, lastRank: Math.max(...board.filter(p => !p.isHouse).map(p => p.rank)) };
      listEl.innerHTML = T.ladderHead() + board.map(p => T.card(p, ctx)).join("");
    }

    // 一局的共用資訊：加總檢查、贏家排序、修改／刪除按鈕
    function roundInfo(r) {
      const dong = r.dong || 0;
      const sum = r.sum ?? r.matches.reduce((acc, m) => acc + m.score, 0) + dong;
      const invalid = r.valid === false || sum !== 0;
      const ranked = [...r.matches].sort((a, b) => b.score - a.score);
      const top = ranked.length && ranked[0].score > 0 ? ranked[0].score : null;
      const flag = invalid
        ? `<div class="flag">⚠️ 輸贏 + 東錢 = ${sum > 0 ? "+" : ""}${sum}，不為零${r.row ? `（試算表第 ${r.row} 列）` : ""}</div>`
        : "";
      const actions = r.row && session
        ? `<div class="actions"><button type="button" class="edit" data-row="${r.row}">${T.editBtn}</button><button type="button" class="del" data-row="${r.row}">${T.delBtn}</button></div>`
        : "";
      return { dong, sum, invalid, ranked, top, flag, actions };
    }

    function renderHistory() {
      if (!records.length) return showStatus("目前還沒有任何對局紀錄。");

      // 新到舊，依日期分組
      const sorted = [...records].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.row || 0) - (a.row || 0)));
      let html = "";
      let lastDate = null;

      sorted.forEach(r => {
        if (r.date !== lastDate) {
          html += T.day(r.date);
          lastDate = r.date;
        }
        html += T.round(r, roundInfo(r));
      });

      listEl.innerHTML = html;
    }

    // 標題下方的大盤指數與跑馬燈
    function renderHero() {
      heroEl.innerHTML = records.length ? T.hero(records) : "";
    }

    function render() {
      statusEl.hidden = true;
      const isEntry = currentView === "entry";
      houseToggleEl.hidden = currentView !== "ladder";
      entryForm.hidden = !isEntry;
      listEl.hidden = isEntry;
      refreshPlayerNames();
      renderHero();

      if (isEntry) {
        noticeEl.hidden = true;
        return;
      }
      if (currentView === "ladder") renderLadder();
      else renderHistory();

      const bad = records.filter(r => r.valid === false || (r.sum ?? 0) !== 0).length;
      if (bad && currentView === "ladder") {
        noticeEl.textContent = `⚠️ 有 ${bad} 筆成交帳務異常（加總不為零），請到「成交明細」檢查`;
        noticeEl.className = "notice warn";
        noticeEl.hidden = false;
      } else if (DEMO_MODE) {
        noticeEl.textContent = "示範模式：尚未設定 API_URL，以下為假資料";
        noticeEl.className = "notice";
        noticeEl.hidden = false;
      } else {
        noticeEl.hidden = true;
      }
    }

    function showStatus(msg) {
      if (currentView === "entry") return;
      listEl.innerHTML = "";
      statusEl.textContent = msg;
      statusEl.hidden = false;
    }

    function setFooter(updatedAt, fromCache) {
      const t = updatedAt ? new Date(updatedAt).toLocaleString("zh-TW", { hour12: false }) : "—";
      footerEl.textContent = `共 ${records.length} 場 · 資料時間 ${t}${fromCache ? "（快取）" : ""}`;
    }

    // ---------- 資料載入 ----------

    let demoStore = null;

    async function fetchData(force = false) {
      const data = await postApi({ action: "list", nocache: force });
      return normalize(data);
    }

    async function load(force = false) {
      const seq = ++loadSeq;
      refreshBtn.classList.add("spinning");
      try {
        const payload = await fetchData(force);
        if (seq !== loadSeq) return; // 期間換了房間
        records = payload.records;
        if (!DEMO_MODE) writeCache(payload);
        render();
        setFooter(payload.updatedAt, false);
      } catch (err) {
        console.error(err);
        if (err.code === "AUTH" || seq !== loadSeq) return;
        if (!records.length) {
          showStatus("❌ 載入失敗，請檢查網路後按 ↻ 重試。");
        } else {
          noticeEl.textContent = "⚠️ 無法更新，目前顯示的是上次的資料";
          noticeEl.className = "notice warn";
          noticeEl.hidden = false;
        }
      } finally {
        refreshBtn.classList.remove("spinning");
      }
    }

    // ---------- 示範資料 ----------

    function demoRecords() {
      const names = ["阿明", "小美", "老王", "胖虎", "大雄"];
      const out = [];
      let seed = 7;
      const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      for (let i = 0; i < 14; i++) {
        const day = new Date(2026, 8, 1 + i * 3);
        const pool = [...names].sort(() => rand() - 0.5).slice(0, 4);
        const dong = i % 3 === 0 ? 0 : 100;
        const s = [0, 0, 0].map(() => Math.round((rand() * 1000 - 500) / 50) * 50);
        s.push(-s.reduce((a, b) => a + b, 0) - dong);
        out.push({
          row: i + 2,
          date: day.toISOString().slice(0, 10),
          dong,
          sum: 0,
          valid: true,
          matches: pool.map((name, k) => ({ name, score: s[k] }))
        });
      }
      // 故意放一筆加總不為零，示範檢查功能
      out.push({
        row: 16, date: "2026-10-20", sum: 100, valid: false,
        matches: [{ name: "阿明", score: 400 }, { name: "小美", score: -100 }, { name: "老王", score: -100 }, { name: "胖虎", score: -100 }]
      });
      return out;
    }

    // ---------- 寫入 ----------

    // 用 text/plain 送 JSON：屬於「簡單請求」，不會觸發 Apps Script 不支援的 CORS preflight
    async function postApi(body) {
      if (DEMO_MODE) return demoPost(body);
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(session ? { ...body, token: session.token } : body),
        redirect: "follow"
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) {
        const err = new Error(data.error || "操作失敗");
        err.code = data.code;
        if (data.code === "AUTH") logout(data.error);
        throw err;
      }
      return data;
    }

    function demoPost(body) {
      if (body.action === "login") return { ok: true, token: "demo", room: { name: "示範房間" } };
      if (body.action === "list") return { ok: true, updatedAt: new Date().toISOString(), records: (demoStore ||= demoRecords()) };
      demoStore ||= demoRecords();
      if (body.action === "add") {
        const row = Math.max(1, ...demoStore.map(r => r.row)) + 1;
        demoStore.push({ row, date: body.date, dong: body.dong || 0, sum: 0, valid: true, matches: body.matches });
        return { ok: true, row };
      }
      if (body.action === "update") {
        const rec = demoStore.find(r => r.row === body.row);
        if (rec) Object.assign(rec, { date: body.date, dong: body.dong || 0, sum: 0, valid: true, matches: body.matches });
        return { ok: true, row: body.row };
      }
      demoStore = demoStore.filter(r => r.row !== body.row);
      return { ok: true, row: body.row };
    }

    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2500);
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    // 依出場次數排序，常打的人排前面
    function refreshPlayerNames() {
      const count = {};
      records.forEach(r => r.matches.forEach(m => { count[m.name] = (count[m.name] || 0) + 1; }));
      playerNamesEl.innerHTML = Object.keys(count)
        .sort((a, b) => count[b] - count[a])
        .map(n => `<option value="${escapeHtml(n)}"></option>`)
        .join("");
    }

    function buildSeats() {
      seatsEl.innerHTML = Array.from({ length: SEAT_COUNT }, (_, i) => `
        <div class="seat-row">
          <span class="p">${i + 1}P</span>
          <input class="name" list="player-names" autocomplete="off" placeholder="玩家 ${i + 1}" maxlength="30" aria-label="玩家 ${i + 1} 名稱" />
          <button type="button" class="sign pos" aria-label="切換正負號">+</button>
          <input class="score" inputmode="numeric" pattern="[0-9]*" placeholder="0" aria-label="玩家 ${i + 1} 輸贏" />
        </div>`).join("");
    }

    function readSeats() {
      return [...seatsEl.querySelectorAll(".seat-row")].map(row => {
        const raw = row.querySelector(".score").value.replace(/[^\d]/g, "");
        const neg = row.querySelector(".sign").classList.contains("neg");
        return {
          name: row.querySelector(".name").value.trim(),
          raw,
          score: raw === "" ? 0 : (neg ? -1 : 1) * Number(raw)
        };
      });
    }

    function readDong() {
      const raw = entryDong.value.replace(/[^\d]/g, "");
      return raw === "" ? 0 : Number(raw);
    }

    function setSign(row, negative) {
      const btn = row.querySelector(".sign");
      btn.classList.toggle("neg", negative);
      btn.classList.toggle("pos", !negative);
      btn.textContent = negative ? "−" : "+";
    }

    function validateEntry() {
      const seats = readSeats();
      const dong = readDong();
      const sum = seats.reduce((acc, s) => acc + s.score, 0) + dong;
      const names = seats.map(s => s.name).filter(Boolean);
      const blanks = seats.filter(s => s.raw === "");
      let problem = "";

      if (names.length < SEAT_COUNT) problem = "請填滿 4 位玩家";
      else if (new Set(names).size < SEAT_COUNT) problem = "玩家名稱重複了";
      else if (blanks.length) problem = "還有人沒填輸贏";
      else if (sum !== 0) problem = dong ? "四人輸贏 + 東錢需為 0" : "四人輸贏加總需為 0";

      const fillable = blanks.length === 1 && sum !== 0;
      sumLineEl.className = "sum-line " + (sum === 0 && !blanks.length ? "ok" : "bad");
      sumLineEl.innerHTML = `
        <span>${dong ? `四人 + 東 ${dong}` : "加總"} = ${sum > 0 ? "+" : ""}${sum}${sum === 0 && !blanks.length ? " ✓" : ""}</span>
        ${fillable ? `<button type="button" class="btn small" id="autofill">空白的人補 ${-sum > 0 ? "+" : ""}${-sum}</button>` : ""}`;

      entrySubmit.disabled = !!problem || !entryDate.value;
      return problem;
    }

    function resetScores() {
      seatsEl.querySelectorAll(".seat-row").forEach(row => {
        row.querySelector(".score").value = "";
        setSign(row, false);
      });
      entryErrorEl.textContent = "";
      validateEntry();
    }

    seatsEl.addEventListener("input", () => { entryErrorEl.textContent = ""; validateEntry(); });
    seatsEl.addEventListener("click", e => {
      const btn = e.target.closest(".sign");
      if (!btn) return;
      setSign(btn.closest(".seat-row"), !btn.classList.contains("neg"));
      validateEntry();
    });
    sumLineEl.addEventListener("click", e => {
      if (e.target.id !== "autofill") return;
      const seats = readSeats();
      const sum = seats.reduce((acc, s) => acc + s.score, 0) + readDong();
      const idx = seats.findIndex(s => s.raw === "");
      const row = seatsEl.querySelectorAll(".seat-row")[idx];
      row.querySelector(".score").value = String(Math.abs(sum));
      setSign(row, sum > 0);
      validateEntry();
    });
    entryDate.addEventListener("input", validateEntry);
    entryDong.addEventListener("input", () => { entryErrorEl.textContent = ""; validateEntry(); });

    entryForm.addEventListener("submit", async e => {
      e.preventDefault();
      const problem = validateEntry();
      if (problem) { entryErrorEl.textContent = problem; return; }

      const matches = readSeats().map(({ name, score }) => ({ name, score }));
      const body = { action: editing ? "update" : "add", date: entryDate.value, dong: readDong(), matches };
      // 修改時連同原本的內容一起送，後端可先比對該列是否仍是這一局，避免列號位移改錯局
      if (editing) Object.assign(body, { row: editing.row, original: editing.original });

      entrySubmit.disabled = true;
      entrySubmit.textContent = "送出中…";
      try {
        await postApi(body);
        if (editing) {
          toast("✏️ 已修改這一局");
          exitEdit();
          switchView("history");
        } else {
          toast("✅ 已記錄這一局");
          resetScores(); // 保留玩家名字與東錢，同一桌下一局只要填分數
        }
        await load(true);
      } catch (err) {
        console.error(err);
        entryErrorEl.textContent = `❌ ${err.message}`;
      } finally {
        entrySubmit.textContent = editing ? T.update : T.submit;
        validateEntry();
      }
    });

    // ---------- 修改 ----------

    function setEditMode(on) {
      editBannerEl.hidden = !on;
      entryTitleEl.textContent = on ? T.edit : T.entry;
      entrySubmit.textContent = on ? T.update : T.submit;
      if (on) editLabelEl.textContent = `✏️ 正在修改 ${editing.original.date} 這一局`;
    }

    function startEdit(rec) {
      editing = {
        row: rec.row,
        original: { date: rec.date, dong: rec.dong || 0, matches: rec.matches.map(({ name, score }) => ({ name, score })) }
      };
      entryDate.value = rec.date;
      entryDong.value = rec.dong ? String(rec.dong) : "";
      seatsEl.querySelectorAll(".seat-row").forEach((row, i) => {
        const m = rec.matches[i];
        row.querySelector(".name").value = m ? m.name : "";
        row.querySelector(".score").value = m ? String(Math.abs(m.score)) : "";
        setSign(row, !!m && m.score < 0);
      });
      entryErrorEl.textContent = "";
      setEditMode(true);
      switchView("entry");
      validateEntry();
    }

    function exitEdit() {
      editing = null;
      setEditMode(false);
      buildSeats();
      entryDong.value = "";
      entryDate.value = todayStr();
      entryErrorEl.textContent = "";
      validateEntry();
    }

    document.getElementById("edit-cancel").addEventListener("click", () => {
      exitEdit();
      switchView("history");
    });

    listEl.addEventListener("click", async e => {
      const editBtn = e.target.closest(".edit");
      if (editBtn) {
        const rec = records.find(r => r.row === Number(editBtn.dataset.row));
        if (rec) startEdit(rec);
        return;
      }
      const btn = e.target.closest(".del");
      if (!btn) return;
      const row = Number(btn.dataset.row);
      const rec = records.find(r => r.row === row);
      if (!rec) return;

      const summary = rec.matches.map(m => `${m.name} ${m.score > 0 ? "+" : ""}${m.score}`).join("、") + (rec.dong ? `、東 +${rec.dong}` : "");
      if (!confirm(`確定要刪除 ${rec.date} 這一局？\n${summary}\n\n刪除後會從試算表移除，無法復原。`)) return;

      btn.disabled = true;
      btn.textContent = "刪除中…";
      try {
        await postApi({ action: "delete", row, date: rec.date, dong: rec.dong || 0, matches: rec.matches });
        toast("🗑️ 已刪除");
        await load(true);
      } catch (err) {
        console.error(err);
        toast(`❌ ${err.message}`);
        btn.disabled = false;
        btn.textContent = T.delBtn;
      }
    });

    buildSeats();
    entryDate.value = todayStr();
    validateEntry();

    // ---------- 事件 ----------

    function switchView(view) {
      if (view !== "entry" && editing) exitEdit(); // 離開開打頁就放棄修改，避免回來時忘了自己在改舊局
      currentView = view;
      document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
      if (records.length || view === "entry") return render();
      entryForm.hidden = true;
      listEl.hidden = false;
      houseToggleEl.hidden = view !== "ladder";
      showStatus("目前還沒有任何對局紀錄。");
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => switchView(tab.dataset.view));
    });

    refreshBtn.addEventListener("click", () => load(true));

    try { showHouseEl.checked = localStorage.getItem(SHOW_HOUSE_KEY) !== "0"; } catch {}
    showHouseEl.addEventListener("change", () => {
      try { localStorage.setItem(SHOW_HOUSE_KEY, showHouseEl.checked ? "1" : "0"); } catch {}
      if (records.length) render();
    });

    // ---------- 登入 ----------

    function enterRoom() {
      const guest = !session;
      roomNameEl.textContent = guest ? GUEST_ROOM : session.room;
      roomModeEl.textContent = guest ? "訪客唯讀" : "";
      authBtn.textContent = guest ? "登入" : "登出";
      entryTab.hidden = guest;
      if (guest && currentView === "entry") {
        currentView = "ladder";
        document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === "ladder")));
      }
      loginForm.hidden = true;
      appEl.hidden = false;
      records = [];
      listEl.innerHTML = "";
      footerEl.textContent = "";

      // 換房間時清掉上一個房間輸入過的玩家名字與名稱建議，避免不同房間的人名混在一起
      if (editing) { editing = null; setEditMode(false); }
      buildSeats();
      entryDong.value = "";
      playerNamesEl.innerHTML = "";
      validateEntry();

      // 先顯示這個房間上次的快取（秒開），再背景更新
      const cached = readCache();
      if (cached && cached.records) {
        records = cached.records;
        render();
        setFooter(cached.updatedAt, true);
      } else {
        entryForm.hidden = true;
        listEl.hidden = false;
        statusEl.textContent = T.loading;
        statusEl.hidden = false;
      }
      load(!!session);
    }

    function showLogin(message) {
      appEl.hidden = true;
      loginForm.hidden = false;
      loginErrorEl.textContent = message || "";
      loginPass.value = "";
      (loginUser.value ? loginPass : loginUser).focus();
    }

    function logout(message) {
      session = null;
      writeSession(null);
      enterRoom();
      if (message) showLogin(message);
    }

    authBtn.addEventListener("click", () => {
      if (!session) showLogin();
      else if (confirm(`確定要登出「${session.room}」？`)) logout();
    });
    document.getElementById("login-cancel").addEventListener("click", () => {
      loginForm.hidden = true;
      appEl.hidden = false;
    });

    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      const user = loginUser.value.trim();
      const pass = loginPass.value;
      if (!user || !pass) { loginErrorEl.textContent = "請輸入帳號與密碼"; return; }

      loginSubmit.disabled = true;
      loginSubmit.textContent = "LOADING…";
      loginErrorEl.textContent = "";
      try {
        const data = await postApi({ action: "login", user, pass });
        session = { token: data.token, room: data.room.name };
        writeSession(session);
        loginPass.value = "";
        enterRoom();
        toast(`🀄 歡迎進入「${session.room}」`);
      } catch (err) {
        console.error(err);
        loginErrorEl.textContent = `❌ ${err.message}`;
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.textContent = T.start;
      }
    });

    session = DEMO_MODE ? { token: "demo", room: "示範房間" } : readSession();
    if (session && !session.token) session = null;
    enterRoom();
  </script>
</body>
</html>
